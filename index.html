<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detector AI Audio Test V2</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0}main{max-width:900px;margin:auto;padding:18px}.card{background:#1d1d1f;padding:16px;border-radius:14px;margin:12px 0}button,select{font:inherit;padding:12px;margin:5px;border-radius:10px}.meter{height:18px;background:#333;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#eee}canvas{width:100%;height:130px;background:#080808}.grid{display:grid;gap:12px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}pre{white-space:pre-wrap;word-break:break-word}.ok{color:#6ee7a2}</style></head><body><main><h1>Detector AI — Audio Test V2</h1><div class="card"><button id="start">1. Autoriser le micro</button><br><select id="devices"></select><button id="use">2. Utiliser cette entrée</button><p id="status">En attente.</p></div><div class="grid"><div class="card"><h2>Canal 1</h2><div class="meter"><div class="bar" id="bar1"></div></div><p>RMS <span id="rms1">0</span> — Pic <span id="peak1">0</span></p><canvas id="scope1" width="800" height="130"></canvas></div><div class="card"><h2>Canal 2</h2><div class="meter"><div class="bar" id="bar2"></div></div><p>RMS <span id="rms2">0</span> — Pic <span id="peak2">0</span></p><canvas id="scope2" width="800" height="130"></canvas></div></div><div class="card"><h2>Test</h2><p id="interpret">Fais sonner uniquement le DEUS, puis parle uniquement dans le micro-cravate.</p><button id="rec" disabled>Enregistrer 10 s</button><button id="stop" disabled>Arrêter</button><p id="recstatus"></p><audio id="play" controls></audio></div><div class="card"><h2>Diagnostic</h2><pre id="diag"></pre></div><script src="app.js?v=2"></script></main></body></html>
